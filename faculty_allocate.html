<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Exam Hall Information - Sandip University</title>
    <link rel="stylesheet" href="faculty_allocate.css" />
  </head>
  <body>
    <div class="container">
      <!-- Left space for image/logo -->
      <div class="left-panel">
        <img
          src="https://erp.sandipuniversity.com/assets/images/su-logo.png"
          alt="Sandip University"
          class="uni-image"
        />
      </div>

      <!-- Right form panel -->
      <div class="form-panel">
        <div class="form-card">
          <h1 class="form-title">Exam Hall Information</h1>
          <form id="examForm" action="submit.html">
            <div class="input-group">
              <label for="prn">Username</label>
              <input
                type="text"
                id="prn"
                name="prn"
                placeholder="Enter your Username"
                required
              />
            </div>
            <div class="input-group">
              <label for="password">Password</label>

              <div class="password-box">
                <input
                  type="password"
                  id="password"
                  name="password"
                  placeholder="Enter your password"
                  required
                />

                <span class="toggle-password" onclick="togglePassword()"
                  >👁</span
                >
              </div>
            </div>

            <button type="submit" class="submit-btn">Submit</button>
          </form>
        </div>
      </div>
    </div>
    <script>
      function togglePassword() {
        const passField = document.getElementById("password");

        if (passField.type === "password") {
          passField.type = "text";
        } else {
          passField.type = "password";
        }
      }
      document
        .getElementById("examForm")
        .addEventListener("submit", function (e) {
          e.preventDefault();
          window.location.href = "submit.html";
        });
    </script>
  </body>
</html>
