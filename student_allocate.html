<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Exam Hall Information - Sandip University</title>
    <link rel="stylesheet" href="student_allocate.css" />
  </head>
  <body>
    <div class="container">
      <!-- Left space for image/logo -->
      <div class="left-panel">
        <img
          src="https://erp.sandipuniversity.com/assets/images/su-logo.png"
          alt="Sandeep University"
          class="uni-image"
        />
      </div>

      <!-- Right form panel -->
      <div class="form-panel">
        <div class="form-card">
          <h1 class="form-title">Exam Hall Information</h1>
          <form id="examForm">
            <div class="input-group">
              <label for="prn">PRN</label>
              <input
                type="text"
                id="prn"
                name="prn"
                placeholder="Enter your PRN"
                required
              />
            </div>
            <div class="input-group">
              <label for="division">Division</label>
              <select id="division" name="division" required>
                <option value="">Select Division</option>
                <option value="A">A</option>
                <option value="B">B</option>
                <option value="C">C</option>
                <option value="D">D</option>
              </select>
            </div>
            <button type="submit" class="submit-btn">Submit</button>
          </form>
        </div>
      </div>
    </div>
  </body>
</html>
