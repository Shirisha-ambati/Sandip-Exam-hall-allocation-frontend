<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Room Allocation</title>
    <link rel="stylesheet" href="room.css" />
  </head>

  <body>
    <div class="room-box">
      <h1>Room Allocation</h1>

      <form>
        <div class="input-group">
          <label>Room Number</label>
          <input
            type="number"
            id="roomNo"
            placeholder="Enter Room No (10,20,30...)"
            required
          />
        </div>

        <div class="input-group">
          <label>Number of Benches</label>
          <input type="number" placeholder="Enter number of benches" required />
        </div>

        <div class="input-group">
          <label>Bench Type / Arrangement</label>
          <select>
            <option>Select option</option>
            <option>2 Students per bench</option>
            <option>3 Students per bench</option>
            <option>Single seating</option>
          </select>
        </div>

        <button type="submit" class="generate-btn">
          Generate Sitting Arrangement
        </button>
      </form>
    </div>
    <script>
      document.querySelector("form").addEventListener("submit", function (e) {
        const roomNo = document.getElementById("roomNo").value;

        if (roomNo % 10 !== 0) {
          alert("Room number must be in multiples of 10 (10, 20, 30...)");
          e.preventDefault();
        }
      });
    </script>
  </body>
</html>
